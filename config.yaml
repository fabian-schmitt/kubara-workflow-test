apiVersion: kubara.io/v1alpha7
kind: PlatformSetup
metadata:
  name: platform
spec:
  clusters:
  - argocd:
      repo:
        authMode: https
        git:
          components:
            targetRevision: main
            url: https://github.com/your-user/your-gitops-repo.git
          configs:
            targetRevision: main
            url: https://github.com/your-user/your-gitops-repo.git
      selfManaged: enabled
    catalogs:
    - oci://ghcr.io/kubara-io/catalogs/general:7.0.0
    dnsName: test-cluster-local.traefik.me
    name: test-cluster
    networking:
      ingress:
        className: traefik
      type: ingress
    services:
      cert-manager:
        config:
          clusterIssuer:
            email: yourname@your-domain.de
            name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
        status: enabled
      crossplane:
        status: disabled
      external-dns:
        status: disabled
      external-secrets:
        status: enabled
      homer-dashboard:
        status: enabled
      kube-prometheus-stack:
        status: enabled
      kyverno:
        status: disabled
      kyverno-policies:
        status: disabled
      kyverno-policy-reporter:
        status: disabled
      loki:
        status: disabled
      longhorn:
        status: disabled
      metallb:
        status: disabled
      metrics-server:
        status: enabled
      oauth2-proxy:
        status: disabled
      reloader:
        status: disabled
      traefik:
        status: enabled
      velero:
        config:
          backupMode: fs-backup
          backupStorage:
            create: true
            region: eu01
        status: disabled
    ssoOrg: local
    ssoTeam: local
    stage: local
    type: hub
# Test drift
